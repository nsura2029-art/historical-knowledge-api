name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm --filter @hka/api test

      - name: Secret scan
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --no-banner --exit-code 1 || true
          else
            echo "gitleaks not installed; skipping (manual check at https://github.com/gitleaks/gitleaks)"
          fi

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (deploy:preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hka/api deploy:preview

      - name: Smoke test
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url || format('https://historical-knowledge-api-preview.nsura2029.workers.dev', '') }}
        run: pnpm --filter @hka/api preview:smoke
